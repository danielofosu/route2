name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS + Codex
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --verbose

      - name: Validate routing policy
        run: cargo run -- validate

      - name: Run core and integration tests
        run: cargo test --verbose

      - name: Validate adapter and benchmark contracts
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node for the provider proxy
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test provider transport and routing
        run: node --test tests/*_test.mjs
